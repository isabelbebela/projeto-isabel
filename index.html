<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de Senhas</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <img src="img/cadeado.png" alt="Cadeado">


    <h1>Gerador de senhas</h1>


    <p>
        Gere instantaneamente uma senha aleatória e segura
    </p>



    <!-- CAMPO DA SENHA -->

    <div class="senha-box">

        <label for="campo-senha">
            Senha
        </label>


        <input
            type="text"
            id="campo-senha"
            placeholder="Digite sua senha">


    </div>




    <!-- CONFIGURAÇÕES -->

    <section class="configuracoes">


        <h2>
            Personalize sua senha
        </h2>



        <div class="conteudo">



            <!-- QUANTIDADE -->

            <div class="coluna">


                <h3>
                    Número de caracteres
                </h3>



                <div class="contador">


                    <button>
                        -
                    </button>


                    <span>
                        12
                    </span>


                    <button>
                        +
                    </button>


                </div>


            </div>





            <!-- CARACTERÍSTICAS -->

            <div class="coluna">


                <h3>
                    Características da senha
                </h3>



                <label>

                    <input type="checkbox">

                    Letras maiúsculas

                </label>



                <label>

                    <input type="checkbox">

                    Letras minúsculas

                </label>



                <label>

                    <input type="checkbox">

                    Números

                </label>



                <label>

                    <input type="checkbox">

                    Símbolos

                </label>


            </div>






            <!-- FORÇA -->

            <div class="coluna">


                <h3>
                    Força da senha
                </h3>




                <div class="barra">


                    <div class="nivel">

                    </div>


                </div>





                <div class="legenda">


                    <span>
                        Fraca
                    </span>


                    <span>
                        Média
                    </span>


                    <span>
                        Forte
                    </span>



                </div>



            </div>




        </div>



    </section>



</div>



</body>

</html>
            </div>

        </div>

    </section>


</div>


<script src="script.js"></script>

</body>

</html>
